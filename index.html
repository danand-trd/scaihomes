<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shikha Anand | Realtor, Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --clay: #A9532F;
    --pine: #1F2E28;
    --cream: #FAF5EC;
    --gold: #B9924A;
    --ink: #2B2620;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vw;
  }
  .card {
    max-width: 480px;
    text-align: center;
  }
  .headshot {
    width: 150px; height: 150px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 28px;
    display: block;
    border: 1.5px solid var(--pine);
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--clay);
    margin-bottom: 16px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(30px, 5vw, 40px);
    color: var(--pine);
    margin-bottom: 10px;
  }
  .role {
    font-size: 15px;
    color: #5c5548;
    margin-bottom: 34px;
  }
  .status {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--pine);
    background: rgba(185,146,74,0.15);
    border: 1px solid var(--gold);
    padding: 8px 18px;
    border-radius: 3px;
    margin-bottom: 36px;
  }
  .contact {
    font-size: 15px;
    line-height: 1.9;
  }
  .contact .k {
    display: block;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--clay);
    margin-top: 18px;
  }
  .contact a { color: var(--pine); text-decoration: none; border-bottom: 1px solid var(--gold); }

</style>
</head>
<body>
  <div class="card">
    <img class="headshot" src="images/shikha.jpg" alt="Shikha Anand">
    <div class="eyebrow">Compass</div>
    <h1>Shikha Anand</h1>
    <p class="role">Realtor® · Triangle, NC</p>
    <div class="status">Site launching soon</div>
    <div class="contact">
      <span class="k">Email</span>
      <a href="mailto:shikha@scaihomes.com">shikha@scaihomes.com</a>
    </div>
  </div>
</body>
</html>
